name: Build release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack
      - shell: pwsh
        run: |
          $asset = Get-Item opencode-task-supervisor-*.tgz
          node scripts/release-protocol-manifest.mjs $asset.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item opencode-task-supervisor-*.tgz, opencode-task-supervisor-*.protocols.json | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-task-supervisor-release
          path: |
            opencode-task-supervisor-*.tgz
            opencode-task-supervisor-*.protocols.json
            SHA256SUMS
